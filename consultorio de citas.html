<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de citas</title>
</head>
<body>
    <h1>REGISTRO DE CITAS MEDICAS</h1>

    <form>
        <label for="nombre">Nombre del paciente</label>
        <input type="text" required>

        <br><br>

        <label for="phone">Telefono del paciente</label>
        <input type="number" name="telefono" id="none" required>

        <br><br>

        <label for="fecha">Registra tu fecha</label>
        <input type="date" name="calendario de citas" id="none" required>

        <br><br>

        <label for="hora">Registra la hora</label>
        <input type="time" required> 

        <br><br>

        <input type="submit" value="agendar cita">
        <input type="reset" value="bajar cita">
    </form>
    <a href="index.html">Registro de Usuario</a>
    <a href="encuesta de satisfaccion.html">Encuesta</a>
</body>
</html>
