<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Encuesta de Satisfacción</title>
</head>
<body>

    <h1>Encuesta de Satisfacción</h1>

    <form>

        <p>1. ¿Qué tan satisfecho estás con las conferencias?</p>

        <input type="radio" name="satisfaccion" value="muy satisfecho">
        <label>Muy satisfecho</label><br>

        <input type="radio" name="satisfaccion" value="satisfecho">
        <label>Satisfecho</label><br>

        <input type="radio" name="satisfaccion" value="regular">
        <label>Regular</label><br>

        <input type="radio" name="satisfaccion" value="insatisfecho">
        <label>Insatisfecho</label>


        <p>2. ¿Qué temas te interesan?</p>

        <input type="checkbox" name="tema" value="tecnologia">
        <label>Tecnología</label><br>

        <input type="checkbox" name="tema" value="ia">
        <label>Inteligencia Artificial</label><br>

        <input type="checkbox" name="tema" value="negocios">
        <label>Negocios</label><br>

        <input type="checkbox" name="tema" value="educacion">
        <label>Educación</label>


        <p>3. Selecciona tu país:</p>

        <select name="pais">
            <option>México</option>
            <option>Estados Unidos</option>
            <option>Canadá</option>
            <option>España</option>
        </select>


        <p>4. ¿Volverías a asistir?</p>

        <input type="radio" name="asistir" value="si">
        <label>Sí</label>

        <input type="radio" name="asistir" value="no">
        <label>No</label>

        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Cancelar">

    </form>
    <a href="index.html">index</a>
    <a href="consultorio de citas.html">Consultorio de citas</a>
</body>
</html>
